services:
  proxy:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      YOUTRACK_URL: "${YOUTRACK_URL:-https://example.youtrack.cloud}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
