name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  # Serialize release-producing runs so one run's CalVer counter read and
  # tag/release creation never overlap another's. Queued runs still execute
  # (no cancel), so each reads a fresh tag count after the prior run's tag exists.
  group: calver-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'

      - run: go build -v ./...

      - run: go test -v ./...

      # Compute a per-day CalVer with a zero-padded, auto-incrementing counter:
      # v2026.08.30.01, v2026.08.30.02, ... The counter is the number of existing
      # tags for today's date + 1. Only runs for pushes to the default branch.
      - name: Compute CalVer version
        id: calver
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          date="$(date -u +'%Y.%m.%d')"
          count="$(git tag -l "v${date}.*" | wc -l | tr -d ' ')"
          seq="$(printf '%02d' "$((count + 1))")"
          version="${date}.${seq}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Computed version: v${version}"

      - name: Registry login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.calver.outputs.version }},enable=${{ steps.calver.outputs.version != '' }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Create the matching git tag + GitHub Release. The tag name (v<version>)
      # mirrors the CalVer Docker image tag exactly.
      - name: Create Release
        if: steps.calver.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.calver.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "v${{ steps.calver.outputs.version }}" \
            --generate-notes
